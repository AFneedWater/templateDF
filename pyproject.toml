[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "templatedf"
version = "0.0.1"
description = "Independent peptide template reconstruction project (budgeted 1A training stage)"
readme = "README.md"
license-files = ["licenses/RAYGUN_LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["torch>=2.9", "numpy>=1.24", "fair-esm>=2.0,<3", "PyYAML>=6"]

[project.optional-dependencies]
check = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
